<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>立肯隆型錄</title>

<link rel="stylesheet" href="css/magazine.css">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>

<style>
body {
  margin: 0;
  background: #2b2b2b;
}

/* 書本 */
#flipbook {
  width: 90vw;
  max-width: 1000px;
  height: 650px;
  margin: 60px auto;
}

/* 每頁 */
#flipbook div {
  background: white;
}

#flipbook img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 聯絡按鈕 */
.contact-group {
  position: fixed;
  right: 20px;
  bottom: 30px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact-btn {
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 12px 18px;
  cursor: pointer;
  letter-spacing: 2px;
  border: 1px solid #fff;
  font-size: 13px;
  text-align: center;
}

.contact-btn:hover {
  background: #fff;
  color: #000;
}
</style>

</head>

<body>

<div id="flipbook"></div>

<!-- 聯絡按鈕 -->
<div class="contact-group">
  <div class="contact-btn" onclick="callPhone()">電話聯絡</div>
  <div class="contact-btn" onclick="sendEmail()">Email</div>
</div>

<script>
$(document).ready(function () {

  let totalPages = 10; // 你有10張圖

  for (let i = 1; i <= totalPages; i++) {
    $('#flipbook').append(
      '<div><img src="pages/' + i + '.jpg"></div>'
    );
  }

  $('#flipbook').turn({
    width: 1000,
    height: 650,
    autoCenter: true
  });

});

// 電話
function callPhone() {
  window.location.href = "tel:033246772";
}

// Email
function sendEmail() {
  window.location.href = "mailto:lekro.tp.033246772@gmail.com";
}
</script>

</body>
</html>
