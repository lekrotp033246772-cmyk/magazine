<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>立肯隆型錄</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@master/turn.js"></script>

<style>
body {
    margin: 0;
    background: #2b2b2b;
    overflow: hidden;
}

/* ⭐ 關鍵：用絕對置中，不用 flex */
#flipbook {
    width: 1000px;
    height: 600px;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#flipbook div {
    width: 100%;
    height: 100%;
}

#flipbook img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 按鈕 */
.contact-group {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    color: #fff;
    text-decoration: none;
}

.phone { background: #27ae60; }
.email { background: #2980b9; }
.pdf   { background: #e74c3c; }

</style>
</head>

<body>

<div id="flipbook">
    <div><img src="pages/1.jpg"></div>
    <div><img src="pages/2.jpg"></div>
    <div><img src="pages/3.jpg"></div>
    <div><img src="pages/4.jpg"></div>
    <div><img src="pages/5.jpg"></div>
    <div><img src="pages/6.jpg"></div>
    <div><img src="pages/7.jpg"></div>
    <div><img src="pages/8.jpg"></div>
    <div><img src="pages/9.jpg"></div>
    <div><img src="pages/10.jpg"></div>
</div>

<div class="contact-group">
    <a href="tel:0900000000" class="btn phone">📞</a>
    <a href="mailto:test@gmail.com" class="btn email">✉️</a>
    <a href="catalog.pdf" class="btn pdf" target="_blank">📄</a>
</div>

<script>
$(function(){
    $('#flipbook').turn({
        width: 1000,
        height: 600,
        autoCenter: true
    });
});
</script>

</body>
</html>
