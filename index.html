<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>型錄</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@master/turn.js"></script>

<style>
body {
    margin: 0;
    background: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#flipbook {
    width: 90vw;
    height: 80vh;
}

#flipbook div {
    width: 100%;
    height: 100%;
}

#flipbook img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div id="flipbook">
    <div><img src="pages/1.jpg"></div>
    <div><img src="pages/2.jpg"></div>
    <div><img src="pages/3.jpg"></div>
    <div><img src="pages/4.jpg"></div>
    <div><img src="pages/5.jpg"></div>
    <div><img src="pages/6.jpg"></div>
    <div><img src="pages/7.jpg"></div>
    <div><img src="pages/8.jpg"></div>
    <div><img src="pages/9.jpg"></div>
    <div><img src="pages/10.jpg"></div>
</div>

<script>
$(function(){
    $('#flipbook').turn({
        width: $('#flipbook').width(),
        height: $('#flipbook').height(),
        autoCenter: true
    });
});
</script>

</body>
</html>
