<script>

  let pageFlip;

  window.addEventListener("load", function () {

    // 初始化翻頁

    pageFlip = new St.PageFlip(
      document.getElementById("book"),
      {

        width: 450,
        height: 650,

        size: "stretch",

        minWidth: 315,
        maxWidth: 1000,

        minHeight: 420,
        maxHeight: 1350,

        maxShadowOpacity: 0.5,

        showCover: true,

        mobileScrollSupport: true,

        flippingTime: 900,

        usePortrait: true,

        autoSize: true

      }
    );

    // 載入頁面

    pageFlip.loadFromHTML(
      document.querySelectorAll(".page")
    );

    // 自動聚焦頁面

    document.body.setAttribute("tabindex", "0");
    document.body.focus();

    // 鍵盤方向鍵翻頁

    window.addEventListener("keydown", function (e) {

      // 下一頁

      if (
        e.key === "ArrowRight" ||
        e.key === "PageDown"
      ) {

        e.preventDefault();

        pageFlip.flipNext();

      }

      // 上一頁

      if (
        e.key === "ArrowLeft" ||
        e.key === "PageUp"
      ) {

        e.preventDefault();

        pageFlip.flipPrev();

      }

    });

    // 點擊左右區域翻頁

    document.addEventListener("click", function(e){

      const screenWidth = window.innerWidth;

      // 點右半邊 下一頁

      if(e.clientX > screenWidth / 2){

        pageFlip.flipNext();

      }

      // 點左半邊 上一頁

      else{

        pageFlip.flipPrev();

      }

    });

  });

</script>
