<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>LEKRO 型錄</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- turn.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style>
body {
    margin: 0;
    background: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 書本 */
#flipbook {
    width: 900px;
    height: 600px;
}

/* 每頁 */
#flipbook div {
    width: 100%;
    height: 100%;
}

/* 圖片 */
#flipbook img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>

</head>
<body>

<div id="flipbook">
    <div><img src="pages/1.jpg"></div>
    <div><img src="pages/2.jpg"></div>
    <div><img src="pages/3.jpg"></div>
    <div><img src="pages/4.jpg"></div>
    <div><img src="pages/5.jpg"></div>
    <div><img src="pages/6.jpg"></div>
    <div><img src="pages/7.jpg"></div>
    <div><img src="pages/8.jpg"></div>
    <div><img src="pages/9.jpg"></div>
    <div><img src="pages/10.jpg"></div>
</div>

<script>
$(function(){
    $('#flipbook').turn({
        width: 900,
        height: 600,
        autoCenter: true
    });
});
</script>

</body>
</html>
